<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/nav.css">
<style>
  :root {
    --green: #1a7a3c;
    --green-light: #2ecc71;
    --navy: #1a2530;
    --amber: #b05e00;
    --red: #c0392b;
    --bg: #f0f5f0;
    --border: #d9e6d9;
    --gray2: #3d5166;
    --gray3: #5f7080;
    --gray4: #8fa3b3;
    --r: 16px;
    --card-shadow: 0 4px 24px rgba(26,122,60,0.10), 0 1.5px 6px rgba(0,0,0,0.05);
    --card-hover-shadow: 0 8px 36px rgba(26,122,60,0.16), 0 2px 10px rgba(0,0,0,0.08);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #eaf3eb;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ── Animated background ─────────────────────────────── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 10% 20%, rgba(46,204,113,0.13) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 90% 80%, rgba(26,122,60,0.10) 0%, transparent 55%),
      radial-gradient(ellipse 60% 70% at 50% 50%, rgba(26,37,48,0.03) 0%, transparent 70%),
      linear-gradient(160deg, #e8f5ec 0%, #f0f9f2 40%, #e4f0e6 100%);
    z-index: 0;
    pointer-events: none;
  }

  /* Floating leaves */
  .leaves-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .leaf {
    position: absolute;
    font-size: 1.6rem;
    opacity: 0.07;
    animation: floatLeaf linear infinite;
    will-change: transform;
  }
  .leaf:nth-child(1)  { left: 5%;  top: 10%; font-size: 2rem;   animation-duration: 18s; animation-delay: 0s; }
  .leaf:nth-child(2)  { left: 18%; top: 75%; font-size: 1.2rem; animation-duration: 22s; animation-delay: -5s; }
  .leaf:nth-child(3)  { left: 35%; top: 30%; font-size: 1.8rem; animation-duration: 20s; animation-delay: -9s; }
  .leaf:nth-child(4)  { left: 60%; top: 15%; font-size: 1rem;   animation-duration: 25s; animation-delay: -3s; }
  .leaf:nth-child(5)  { left: 75%; top: 55%; font-size: 2.2rem; animation-duration: 17s; animation-delay: -12s; }
  .leaf:nth-child(6)  { left: 88%; top: 80%; font-size: 1.4rem; animation-duration: 21s; animation-delay: -7s; }
  .leaf:nth-child(7)  { left: 50%; top: 90%; font-size: 1.6rem; animation-duration: 19s; animation-delay: -15s; }
  .leaf:nth-child(8)  { left: 92%; top: 35%; font-size: 1.2rem; animation-duration: 23s; animation-delay: -2s; }
  @keyframes floatLeaf {
    0%   { transform: translateY(0px) rotate(0deg); }
    33%  { transform: translateY(-18px) rotate(8deg); }
    66%  { transform: translateY(-8px) rotate(-5deg); }
    100% { transform: translateY(0px) rotate(0deg); }
  }

  /* ── Layout ──────────────────────────────────────────── */
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1240px;
    margin: 0 auto;
    padding: 28px 24px 52px;
  }

  /* ── Section title ───────────────────────────────────── */
  .sec-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.22rem;
    font-weight: 700;
    color: #1a4028;
    letter-spacing: -0.01em;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sec-title .sec-tag {
    font-family: 'DM Sans', sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.2px;
    background: linear-gradient(135deg, #1a7a3c, #2ecc71);
    color: #fff;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    vertical-align: middle;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* ── Sensor grid ─────────────────────────────────────── */
  .sgrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 26px;
  }
  @media (max-width: 900px) { .sgrid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 700px) { .sgrid { grid-template-columns: repeat(3, 1fr); } }

  .scard {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px 16px 14px;
    box-shadow: var(--card-shadow);
    position: relative;
    overflow: hidden;
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
  }
  .scard::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--card-accent, #1a7a3c), #2ecc71);
    border-radius: 18px 18px 0 0;
  }
  .scard::after {
    content: '';
    position: absolute;
    top: -30px; right: -20px;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(46,204,113,0.09) 0%, transparent 70%);
    pointer-events: none;
  }
  .scard:hover {
    transform: translateY(-4px);
    box-shadow: var(--card-hover-shadow);
    border-color: rgba(26,122,60,0.35);
  }
  .scard .icon {
    font-size: 20px;
    margin-bottom: 10px;
    display: block;
  }
  .scard .slabel {
    font-size: 9.5px;
    color: var(--gray4);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .scard .sval {
    font-size: 28px;
    font-weight: 700;
    color: var(--green);
    line-height: 1;
    font-family: 'Playfair Display', serif;
  }
  .scard .sunit {
    font-size: 9.5px;
    color: var(--gray4);
    margin-top: 3px;
  }

  /* bar */
  .bar-track {
    height: 5px;
    background: #e8f0eb;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 10px;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.8s ease;
    background: var(--green);
  }

  /* status pill */
  .sts {
    display: inline-block;
    margin-top: 7px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.6px;
    padding: 2px 9px;
    border-radius: 20px;
    text-transform: uppercase;
  }
  .s-ok  { background: #e8f5ee; color: #1a7a3c; }
  .s-warn{ background: #fff3e0; color: #b05e00; }
  .s-err { background: #fdecea; color: #c0392b; }

  /* ── Chart box ───────────────────────────────────────── */
  .chart-box {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 20px 14px;
    margin-bottom: 26px;
    box-shadow: var(--card-shadow);
    position: relative;
    overflow: hidden;
  }
  .chart-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #1a7a3c, #2ecc71, #b05e00);
    border-radius: 18px 18px 0 0;
  }

  /* ── Bottom row ──────────────────────────────────────── */
  .brow {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 26px;
  }
  @media (max-width: 700px) { .brow { grid-template-columns: 1fr; } }

  /* ── Log box ─────────────────────────────────────────── */
  .log-box {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    max-height: 270px;
    box-shadow: var(--card-shadow);
    transition: box-shadow 0.22s ease;
  }
  .log-box:hover { box-shadow: var(--card-hover-shadow); }

  .log-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .log-scroll {
    overflow-y: auto;
    flex: 1;
    scrollbar-width: thin;
    scrollbar-color: #b8d4be transparent;
  }
  .log-entry {
    display: flex;
    gap: 8px;
    font-size: 10.5px;
    padding: 5px 0;
    border-bottom: 1px solid #f0f5f1;
    color: var(--gray3);
    align-items: baseline;
  }
  .ltime {
    font-weight: 600;
    color: var(--green);
    white-space: nowrap;
    font-size: 9.5px;
    background: #e8f5ee;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .lmsg { font-size: 9.5px; }

  /* ── Health card ─────────────────────────────────────── */
  .hcard {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    box-shadow: var(--card-shadow);
    transition: box-shadow 0.22s ease;
    position: relative;
    overflow: hidden;
  }
  .hcard::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #1a7a3c, #2ecc71);
    border-radius: 18px 18px 0 0;
  }
  .hcard:hover { box-shadow: var(--card-hover-shadow); }

  .ring-row {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 10px 0 14px;
  }
  .rsvg { width: 76px; height: 76px; flex-shrink: 0; }
  .rc-bg { fill: none; stroke: #e8f0eb; stroke-width: 6; }
  .rc-fg {
    fill: none;
    stroke: var(--green);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 201;
    stroke-dashoffset: 201;
    transition: stroke-dashoffset 1s ease, stroke .5s;
    transform-origin: center;
    transform: rotate(-90deg);
  }
  .rscore {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    font-weight: 700;
    color: var(--green);
    line-height: 1;
  }
  .rlbl {
    font-size: 9px;
    color: var(--gray4);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
    font-weight: 600;
  }
  .verdict {
    font-size: 11.5px;
    font-weight: 600;
    padding: 9px 12px;
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .checks { display: flex; flex-direction: column; gap: 5px; }
  .chk { display: flex; align-items: center; gap: 7px; font-size: 11px; }
  .cdot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  @media (max-width: 600px) {
    .sgrid { grid-template-columns: repeat(2, 1fr) !important; }
    .wrap { padding: 16px 14px 40px; }
    .sec-title { font-size: 1.05rem; }
  }
</style>
</head>
<body>

<!-- Floating leaves decoration -->
<div class="leaves-bg" aria-hidden="true">
  <span class="leaf">🌿</span>
  <span class="leaf">🍃</span>
  <span class="leaf">🌱</span>
  <span class="leaf">🍃</span>
  <span class="leaf">🌿</span>
  <span class="leaf">🌱</span>
  <span class="leaf">🍃</span>
  <span class="leaf">🌿</span>
</div>

<div class="wrap">
  <div class="sec-title" id="L_live">Live Sensor Readings <span class="sec-tag">LIVE</span></div>
  <div class="sgrid" id="sgrid"></div>

  <div class="sec-title" id="L_trend">Trend History — Last 20 Readings</div>
  <div class="chart-box"><canvas id="chart" height="130"></canvas></div>

  <div class="brow">
    <div class="log-box">
      <div class="log-title">📡 Data Log</div>
      <div class="log-scroll" id="logScroll"></div>
    </div>
    <div class="hcard">
      <div class="log-title" id="L_health">🧪 Soil Health Summary</div>
      <div class="ring-row">
        <svg class="rsvg" viewBox="0 0 80 80">
          <circle class="rc-bg" cx="40" cy="40" r="32"/>
          <circle class="rc-fg" id="ringFg" cx="40" cy="40" r="32"/>
        </svg>
        <div>
          <div class="rscore" id="hscore">—</div>
          <div class="rlbl">Health Score</div>
        </div>
      </div>
      <div class="verdict" id="verdict">Awaiting sensor data…</div>
      <div class="checks" id="checks"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
const SENSORS = [
  {key:'temperature',label:'Temperature',unit:'°C',    icon:'🌡️',accent:'#c0392b',min:0,max:60, good:[15,30],warn:[10,38]},
  {key:'moisture',   label:'Moisture',   unit:'%',    icon:'💧',accent:'#1a3f8a',min:0,max:100,good:[40,70],warn:[20,85]},
  {key:'ec',         label:'EC',         unit:'µS/cm',icon:'⚡',accent:'#0d7a8a',min:0,max:1200,good:[200,800],warn:[100,900]},
  {key:'ph',         label:'pH',         unit:'pH',   icon:'⚗️',accent:'#5b3d8a',min:0,max:14, good:[5.5,7.5],warn:[5.0,8.0]},
  {key:'nitrogen',   label:'Nitrogen',   unit:'mg/kg',icon:'🌿',accent:'#1a7a3c',min:0,max:300,good:[80,220],warn:[40,260]},
  {key:'phosphorus', label:'Phosphorus', unit:'mg/kg',icon:'🟡',accent:'#b05e00',min:0,max:200,good:[50,150],warn:[25,175]},
  {key:'potassium',  label:'Potassium',  unit:'mg/kg',icon:'🟠',accent:'#8a3d1a',min:0,max:400,good:[100,300],warn:[50,350]},
];
const THRESH = {
  temperature:{low:10,high:40},moisture:{low:20,high:70},ec:{low:200,high:800},
  ph:{low:5.5,high:8.0},nitrogen:{low:5,high:140},phosphorus:{low:5,high:100},potassium:{low:5,high:205}
};

let history = [], chart = null;

function initCards() {
  const g = document.getElementById('sgrid'); g.innerHTML = '';
  SENSORS.forEach(s => {
    const c = document.createElement('div'); c.className = 'scard';
    c.style.setProperty('--card-accent', s.accent);
    c.innerHTML = `<span class="icon">${s.icon}</span>
      <div class="slabel">${s.label}</div>
      <div class="sval" id="v-${s.key}" style="color:${s.accent}">—</div>
      <div class="sunit">${s.unit}</div>
      <div class="bar-track"><div class="bar-fill" id="b-${s.key}" style="width:0%;background:${s.accent}"></div></div>
      <span class="sts" id="st-${s.key}">—</span>`;
    g.appendChild(c);
  });
}

function initChart() {
  const ctx = document.getElementById('chart').getContext('2d');
  chart = new Chart(ctx, {type:'line',
    data:{labels:[],datasets:SENSORS.map(s => ({
      label:s.label, data:[], borderColor:s.accent, backgroundColor:s.accent+'14',
      borderWidth:1.6, pointRadius:2, tension:0.4, fill:false
    }))},
    options:{responsive:true,animation:{duration:300},interaction:{mode:'index',intersect:false},
      plugins:{legend:{labels:{color:'#8fa3b3',font:{size:9},boxWidth:10,padding:10}},
               tooltip:{backgroundColor:'#fff',borderColor:'#d1d9e0',borderWidth:1,titleColor:'#5f7080',bodyColor:'#1a2530'}},
      scales:{x:{ticks:{color:'#8fa3b3',font:{size:9}},grid:{color:'#f0f3f5'}},
              y:{ticks:{color:'#8fa3b3',font:{size:9}},grid:{color:'#f0f3f5'}}}}
  });
}

function classify(p, val) {
  if (val === null || val === -1) return 'error';
  const t = THRESH[p]; if (!t) return 'ok';
  return val < t.low ? 'low' : val > t.high ? 'high' : 'ok';
}

window.onSensorData = function(data) {
  const now = new Date();
  const ts  = now.toLocaleTimeString('en-GB',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});

  SENSORS.forEach(s => {
    const val = data[s.key], err = (val === null || val === -1 || val === undefined);
    const vEl = document.getElementById('v-'+s.key);
    const bEl = document.getElementById('b-'+s.key);
    const stEl = document.getElementById('st-'+s.key);
    if (!vEl) return;
    if (err) {
      vEl.textContent = 'ERR'; bEl.style.width = '0%';
      stEl.className = 'sts s-err'; stEl.textContent = 'No Signal'; return;
    }
    vEl.textContent = Number.isInteger(val) ? val : val.toFixed(1);
    bEl.style.width = Math.min(100, Math.max(0, ((val - s.min) / (s.max - s.min)) * 100)) + '%';
    const st = classify(s.key, val);
    stEl.className = 'sts ' + (st==='ok'?'s-ok':st==='error'?'s-err':'s-warn');
    stEl.textContent = st==='ok'?'Optimal':st==='error'?'No Signal':'Check';
  });

  history.push({ts,...data});
  if (history.length > 20) history.shift();
  chart.data.labels = history.map(h => h.ts);
  SENSORS.forEach((s, i) => {
    chart.data.datasets[i].data = history.map(h => {
      const v = h[s.key]; return (v === -1 || v === null) ? null : v;
    });
  });
  chart.update('none');

  addLog(ts, `pH:${data.ph===-1?'ERR':data.ph}  M:${data.moisture===-1?'ERR':data.moisture}%  N:${data.nitrogen} P:${data.phosphorus} K:${data.potassium}`);
  updateHealth(data);
};

function addLog(ts, msg) {
  const el = document.getElementById('logScroll');
  const d  = document.createElement('div'); d.className = 'log-entry';
  d.innerHTML = `<span class="ltime">${ts}</span><span class="lmsg">${msg}</span>`;
  el.prepend(d);
  while (el.children.length > 60) el.removeChild(el.lastChild);
}

function updateHealth(data) {
  const W = {ph:25,nitrogen:18,moisture:18,phosphorus:12,potassium:12,temperature:8,ec:7};
  const TH = {temperature:[10,35],moisture:[20,70],ec:[200,800],ph:[5.5,7.5],nitrogen:[60,220],phosphorus:[30,150],potassium:[80,300]};
  let tw = Object.values(W).reduce((a,b)=>a+b,0), sc = 0;
  const checks = [];
  for (const [p, w] of Object.entries(W)) {
    const val = data[p]; const [lo, hi] = TH[p];
    if (val === -1 || val === null) { sc += w*0.3; checks.push({p,ok:false,warn:false}); continue; }
    if (lo <= val && val <= hi) {
      const center=(lo+hi)/2, r=(hi-lo)/2;
      sc += w*(1-0.25*Math.abs(val-center)/r);
      checks.push({p,ok:true,warn:false});
    } else {
      const excess=Math.max(0,val-hi)+Math.max(0,lo-val);
      sc += w*Math.max(0, 1-Math.min(1, excess/((hi-lo)*0.5)));
      checks.push({p,ok:false,warn:(val>lo*0.7&&val<hi*1.3)});
    }
  }
  const score  = Math.round((sc / tw) * 100);
  const sColor = score>=70?'#1a7a3c':score>=40?'#b05e00':'#c0392b';
  document.getElementById('hscore').textContent = score;
  document.getElementById('hscore').style.color = sColor;
  const circ = 2*Math.PI*32;
  const ring = document.getElementById('ringFg');
  ring.style.strokeDashoffset = circ - (score/100)*circ;
  ring.style.stroke = sColor;
  const vEl = document.getElementById('verdict');
  if (score >= 75) {
    vEl.textContent = '✅ Excellent — Soil is in perfect condition';
    vEl.style.cssText = 'background:#e8f5ee;border-left:3px solid #1a7a3c;color:#1a5c2e;font-size:11.5px;font-weight:600;padding:9px 12px;border-radius:10px;margin-bottom:12px;';
  } else if (score >= 50) {
    vEl.textContent = '⚠️ Good — Minor attention needed';
    vEl.style.cssText = 'background:#fff3e0;border-left:3px solid #e07b00;color:#7a3d00;font-size:11.5px;font-weight:600;padding:9px 12px;border-radius:10px;margin-bottom:12px;';
  } else {
    vEl.textContent = '❌ Poor — Critical soil health';
    vEl.style.cssText = 'background:#fdecea;border-left:3px solid #c0392b;color:#8b1a1a;font-size:11.5px;font-weight:600;padding:9px 12px;border-radius:10px;margin-bottom:12px;';
  }
  const ch = document.getElementById('checks'); ch.innerHTML = '';
  checks.forEach(c => {
    const color = c.ok?'#1a7a3c':c.warn?'#b05e00':'#c0392b';
    const d = document.createElement('div'); d.className = 'chk';
    d.innerHTML = `<div class="cdot" style="background:${color}"></div><span style="color:${color};font-weight:600;">${c.ok?'✓':c.warn?'!':'✗'}</span><span style="color:#3d5166;">${c.p.charAt(0).toUpperCase()+c.p.slice(1)}</span>`;
    ch.appendChild(d);
  });
}

window.onLangChange = function(lang) {};

initCards();
initChart();
</script>
</body>
</html>
